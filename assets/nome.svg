<svg width="650" height="90" viewBox="0 0 650 90"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .text {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 38px;
      font-weight: 700;
      fill: #FFFFFF;
    }

    .cursor {
      fill: #FFFFFF;
      animation: blink 0.7s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }

      50%, 100% {
        opacity: 0;
      }
    }
  </style>

  <text x="50%" y="58"
        text-anchor="middle"
        class="text">
    Kauã Praizi
  </text>

  <rect
    x="493"
    y="25"
    width="4"
    height="42"
    class="cursor">
  </rect>

</svg>
